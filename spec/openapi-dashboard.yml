openapi: "3.0.0"

info:
  version: 0.1.0
  title: E2B Dashboard API

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
    AdminJWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    # AuthProviderBearerAuth / AuthProviderTeamAuth: B before T in the name
    # so Bearer is validated before Team.
    AuthProviderBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access_token
    AuthProviderTeamAuth:
      type: apiKey
      in: header
      name: X-Team-ID

  parameters:
    sandboxID:
      name: sandboxID
      in: path
      required: true
      description: Identifier of the sandbox.
      schema:
        type: string
    teamID:
      name: teamID
      in: path
      required: true
      description: Identifier of the team.
      schema:
        type: string
        format: uuid
    clusterID:
      name: clusterID
      in: path
      required: true
      description: Identifier of the cluster.
      schema:
        type: string
        format: uuid
    projectID:
      name: projectID
      in: path
      required: true
      description: Identifier of the project.
      schema:
        type: string
        format: uuid
    templates_limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    templateID:
      name: templateID
      in: path
      required: true
      description: Identifier of the template.
      schema:
        type: string
    tag:
      name: tag
      in: query
      required: true
      description: Template tag name to check.
      schema:
        type: string
        minLength: 1
    tag_assignment_limit:
      name: assignmentLimit
      in: query
      required: false
      description: Maximum number of ready assignment rows to return per tag.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 25
        default: 6
    tag_path:
      name: tag
      in: path
      required: true
      description: Template tag name.
      schema:
        type: string
        minLength: 1
    tag_assignments_limit:
      name: limit
      in: query
      required: false
      description: Maximum number of assignment rows to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    templates_cursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned by the previous list response in `{sort}|{value}|{templateID}` format. Rejected if its sort does not match the request.
      schema:
        type: string
    templates_public:
      name: public
      in: query
      required: false
      description: Filter templates by visibility (true = public, false = internal).
      schema:
        type: boolean
    templates_search:
      name: search
      in: query
      required: false
      description: Case-insensitive substring match on template names, aliases, and template id.
      schema:
        type: string
    templates_sort:
      name: sort
      in: query
      required: false
      description: Sort column and direction.
      schema:
        type: string
        enum: [created_at_asc, created_at_desc, updated_at_asc, updated_at_desc]
        default: created_at_desc
    tag_assignments_cursor:
      name: cursor
      in: query
      required: false
      description: Cursor returned by the previous list response in `assigned_at|assignment_id` format.
      schema:
        type: string
    tag_groups_limit:
      name: tagsLimit
      in: query
      required: false
      description: Maximum number of distinct tags to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
    tag_groups_cursor:
      name: tagsCursor
      in: query
      required: false
      description: Cursor returned by the previous list response in `{sort}|{latest_assigned_at}|{tag}` format (sort-tagged, RFC3339Nano).
      schema:
        type: string
    tag_groups_search:
      name: search
      in: query
      required: false
      description: Case-insensitive substring filter on tag name. Allowed characters are `a-z`, `0-9`, `.`, `_`, `-`.
      schema:
        type: string
        maxLength: 64
        pattern: "^[a-z0-9._-]*$"
    tag_groups_sort:
      name: sort
      in: query
      required: false
      description: Sort order for the returned tag groups.
      schema:
        type: string
        enum: [latest_desc, latest_asc, name_asc, name_desc]
        default: latest_desc

  responses:
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: Authentication error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "501":
      description: Operation is not implemented
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code.
        error_code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Error message.

    ErrorCode:
      type: string
      description: >-
        Stable machine-readable reason for an API error. New codes may be added
        as other errors adopt this contract. Clients must handle absent or unknown
        codes without interpreting the human-readable message.
      enum:
        - cluster_registration_invalid
        - cluster_registration_conflict
        - cluster_assignment_invalid
        - cluster_assignment_project_not_found
        - cluster_assignment_cluster_not_found
        - cluster_assignment_already_assigned
        - cluster_assignment_cluster_deleting

    AdminAuthProviderProfile:
      type: object
      required:
        - userId
        - email
      properties:
        userId:
          type: string
          format: uuid
          description: Internal E2B user identifier.
        email:
          type: string
          nullable: true
          description: Email address from the configured auth provider.

    AdminAuthProviderProfilesResponse:
      type: object
      required:
        - profiles
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuthProviderProfile"

    AdminAuthProviderProfilesResolveRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    AdminClusterCreateRequest:
      type: object
      required:
        - name
        - endpoint
        - endpoint_tls
        - token
      properties:
        cluster_id:
          type: string
          format: uuid
          description: Optional stable identifier for idempotent creation. Reuse succeeds only when the immutable configuration is identical.
        name:
          type: string
          minLength: 1
        endpoint:
          type: string
          minLength: 1
        endpoint_tls:
          type: boolean
        token:
          type: string
          minLength: 1
        sandbox_proxy_domain:
          type: string
          nullable: true
        auth_org_id:
          type: string
          nullable: true

    AdminClusterCreateResponse:
      type: object
      required:
        - cluster_id
      properties:
        cluster_id:
          type: string
          format: uuid

    AdminTeamClusterAssignmentResponse:
      type: object
      required:
        - cluster_id
      properties:
        cluster_id:
          type: string
          format: uuid

    CPUCount:
      type: integer
      format: int64
      minimum: 1
      description: CPU cores for the sandbox

    MemoryMB:
      type: integer
      format: int64
      minimum: 128
      description: Memory for the sandbox in MiB

    DiskSizeMB:
      type: integer
      format: int64
      minimum: 0
      description: Disk size for the sandbox in MiB

    SandboxRecord:
      type: object
      required:
        - templateID
        - sandboxID
        - startedAt
        - cpuCount
        - memoryMB
        - diskSizeMB
        - retentionExpired
        - eventsRetentionExpired
      properties:
        templateID:
          type: string
          description: Identifier of the template from which is the sandbox created
        alias:
          type: string
          description: Alias of the template
        sandboxID:
          type: string
          description: Identifier of the sandbox
        startedAt:
          type: string
          format: date-time
          description: Time when the sandbox was started
        stoppedAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the sandbox was stopped
        domain:
          type: string
          nullable: true
          description: Base domain where the sandbox traffic is accessible
        cpuCount:
          $ref: "#/components/schemas/CPUCount"
        memoryMB:
          $ref: "#/components/schemas/MemoryMB"
        diskSizeMB:
          $ref: "#/components/schemas/DiskSizeMB"
        retentionExpired:
          type: boolean
          description: Whether the sandbox ended more than the fixed retention window ago, so its monitoring and logs data is no longer available
        eventsRetentionExpired:
          type: boolean
          description: Whether the sandbox ended more than the team's events retention window ago, so its events data is no longer available

    HealthResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable health check result.

    DefaultTemplateAlias:
      type: object
      required:
        - alias
      properties:
        alias:
          type: string
        namespace:
          type: string
          nullable: true

    DefaultTemplate:
      type: object
      required:
        - id
        - aliases
        - buildId
        - ramMb
        - vcpu
        - totalDiskSizeMb
        - createdAt
        - public
        - buildCount
        - spawnCount
      properties:
        id:
          type: string
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/DefaultTemplateAlias"
        buildId:
          type: string
          format: uuid
        ramMb:
          type: integer
          format: int64
        vcpu:
          type: integer
          format: int64
        totalDiskSizeMb:
          type: integer
          format: int64
          nullable: true
        envdVersion:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        public:
          type: boolean
        buildCount:
          type: integer
          format: int32
        spawnCount:
          type: integer
          format: int64

    DefaultTemplatesResponse:
      type: object
      required:
        - templates
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/DefaultTemplate"

    TeamTemplate:
      type: object
      required:
        - templateID
        - buildID
        - cpuCount
        - memoryMB
        - diskSizeMB
        - public
        - aliases
        - names
        - createdAt
        - updatedAt
        - createdBy
        - lastSpawnedAt
        - spawnCount
        - buildCount
        - envdVersion
        - isDefault
      properties:
        templateID:
          type: string
        buildID:
          type: string
          format: uuid
        cpuCount:
          type: integer
          format: int64
        memoryMB:
          type: integer
          format: int64
        diskSizeMB:
          type: integer
          format: int64
          nullable: true
        public:
          type: boolean
        aliases:
          type: array
          items:
            type: string
        names:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          nullable: true
          type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              nullable: true
        lastSpawnedAt:
          type: string
          format: date-time
          nullable: true
        spawnCount:
          type: integer
          format: int64
        buildCount:
          type: integer
          format: int32
        envdVersion:
          type: string
          nullable: true
        isDefault:
          type: boolean
        defaultDescription:
          type: string
          nullable: true

    TeamTemplatesResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TeamTemplate"
        nextCursor:
          type: string
          nullable: true
          description: Cursor to pass to the next list request, or `null` if there is no next page.

    TemplateDetail:
      type: object
      description: Dashboard-shaped single-template read. Mirrors the infra-api `Template` schema fields the dashboard renders.
      required:
        - templateID
        - buildID
        - cpuCount
        - memoryMB
        - diskSizeMB
        - public
        - aliases
        - names
        - createdAt
        - updatedAt
        - lastSpawnedAt
        - spawnCount
        - buildCount
        - envdVersion
      properties:
        templateID:
          type: string
          description: Identifier of the template.
        buildID:
          type: string
          description: Identifier of the latest ready build for the template, or the zero UUID when none.
        cpuCount:
          allOf:
            - $ref: "#/components/schemas/CPUCount"
          nullable: true
          description: vCPU count of the latest ready default build, or `null` when none.
        memoryMB:
          allOf:
            - $ref: "#/components/schemas/MemoryMB"
          nullable: true
          description: Memory in MiB of the latest ready default build, or `null` when none.
        diskSizeMB:
          allOf:
            - $ref: "#/components/schemas/DiskSizeMB"
          nullable: true
          description: Disk size in MiB of the latest ready default build, or `null` when none.
        public:
          type: boolean
          description: Whether the template is public or only accessible by the team.
        aliases:
          type: array
          description: Aliases of the template.
          deprecated: true
          items:
            type: string
        names:
          type: array
          description: Names of the template (namespace/alias format when namespaced).
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: Time when the template was created.
        updatedAt:
          type: string
          format: date-time
          description: Time when the template was last updated.
        lastSpawnedAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the template was last used.
        spawnCount:
          type: integer
          format: int64
          description: Number of times the template was used.
        buildCount:
          type: integer
          format: int32
          description: Number of times the template was built.
        envdVersion:
          type: string
          nullable: true
          description: envd version of the latest ready default build, or `null` when none.

    TemplateTagAssignment:
      type: object
      required:
        - assignmentId
        - buildId
        - assignedAt
        - buildCreatedAt
        - buildFinishedAt
      properties:
        assignmentId:
          type: string
          format: uuid
          description: Identifier of the tag assignment event.
        buildId:
          type: string
          format: uuid
          description: Identifier of the assigned build.
        assignedAt:
          type: string
          format: date-time
          description: Time when the tag was assigned to the build.
        buildCreatedAt:
          type: string
          format: date-time
          description: Time when the assigned build was created.
        buildFinishedAt:
          type: string
          format: date-time
          nullable: true
          description: Time when the assigned build finished.

    TemplateTagGroup:
      type: object
      required:
        - tag
        - assignments
        - hasMore
      properties:
        tag:
          type: string
          description: Template tag name.
        assignments:
          type: array
          description: Ready assignment events for this tag, sorted latest first.
          items:
            $ref: "#/components/schemas/TemplateTagAssignment"
        hasMore:
          type: boolean
          description: Whether more ready assignment events exist beyond the requested assignment limit.

    TemplateTagGroupsResponse:
      type: object
      required:
        - tags
        - nextCursor
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TemplateTagGroup"
        nextCursor:
          type: string
          nullable: true
          description: Cursor to pass as `tagsCursor` for the next page, or `null` if there is no next page.

    TemplateTagsCountResponse:
      type: object
      required:
        - total
      properties:
        total:
          type: integer
          format: int64
          description: Total distinct ready tags for the template.

    TemplateTagExistsResponse:
      type: object
      required:
        - exists
        - normalizedTag
      properties:
        exists:
          type: boolean
          description: Whether the template tag has at least one ready assignment.
        normalizedTag:
          type: string
          description: Normalized template tag name.

    TemplateTagAssignmentsResponse:
      type: object
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          description: Ready assignment events for the tag, sorted latest first.
          items:
            $ref: "#/components/schemas/TemplateTagAssignment"
        nextCursor:
          type: string
          nullable: true
          description: Cursor to pass to the next list request, or `null` if there is no next page.

    ManagementClusterProjects:
      type: object
      required: [project_ids]
      properties:
        project_ids:
          type: array
          items:
            type: string
            format: uuid

    ManagementClusterRegistrationRequest:
      type: object
      required:
        - name
        - endpoint
        - endpoint_tls
        - token
      properties:
        name:
          type: string
          minLength: 1
        endpoint:
          type: string
          minLength: 1
        endpoint_tls:
          type: boolean
        token:
          type: string
          minLength: 1
        sandbox_proxy_domain:
          type: string
          nullable: true
        auth_org_id:
          type: string
          nullable: true

    ManagementProjectBlockRequest:
      type: object
      description: >-
        Desired project block state. A newer revision replaces the state,
        including any intervening manual block or unblock.
      required: [revision, blocked]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Monotonic per-project revision. Older or duplicate revisions
            succeed without changing stored state.
        blocked:
          type: boolean
          description: Whether the project is refused billable work.
        reason:
          type: string
          description: >-
            Reason included in blocked-request errors. Cleared when blocked is false.
        decided_at:
          $ref: "#/components/schemas/ManagementDecidedAt"

    ManagementDecidedAt:
      type: string
      format: date-time
      description: >-
        When the caller decided this revision, in RFC 3339. Stored with the
        revision and used to measure how long the decision took to apply here.
        Omit it when the caller does not know; the delivery is then counted as
        origin unknown rather than as zero lag.

tags:
  - name: control-plane-management
    description: Workspace control-plane operations authenticated with service JWTs.
  - name: sandboxes
  - name: templates

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Health check successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /sandboxes/{sandboxID}/record:
    get:
      summary: Sandbox record
      tags: [sandboxes]
      security:
        - AuthProviderBearerAuth: []
          AuthProviderTeamAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "200":
          description: Successfully returned sandbox details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxRecord"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  /admin/clusters:
    post:
      summary: Create a cluster
      description: Creates a cluster whose configuration cannot be modified. The cluster starts with deletion protection turned on.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminClusterCreateRequest"
      responses:
        "201":
          description: Cluster created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClusterCreateResponse"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /admin/clusters/{clusterID}:
    delete:
      summary: Delete a cluster and its environments
      description: Deletes a cluster after all team assignments are detached. In the same transaction, soft-deletes every live template, snapshot template and paused sandbox snapshot on the cluster, releases their aliases, and releases all environment references while preserving environment and build history. A team assignment rejects the deletion and leaves the environments untouched, and so does deletion protection on the cluster. The local cluster's nil ID is rejected. Repeating a completed deletion succeeds.
      tags: [admin]
      security:
        - AdminApiKeyAuth: []
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
      responses:
        "204":
          description: Cluster deleted or already absent.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/clusters/{clusterID}/projects:
    get:
      operationId: managementListClusterProjects
      summary: List the projects assigned to a cluster (v1).
      description: Returns the ID of every project whose team is assigned to the cluster, whichever way it was assigned. A deleted project is never assigned. An absent cluster has no projects.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
      responses:
        "200":
          description: The projects assigned to the cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementClusterProjects"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/clusters/{clusterID}/deletion:
    put:
      operationId: managementRequestClusterDeletion
      summary: Record that a cluster is being deleted (v1).
      description: Records that the caller is deleting the cluster, for a caller that deletes the cluster's teams before the cluster itself. Refused while the cluster has deletion protection turned on; a protection change in flight commits before or after the check, never between. Once recorded, deletion protection cannot be turned on, so the cluster delete that follows is not refused for protection, and no team can be newly assigned to the cluster. An assignment either commits before the deletion is recorded, where the caller's next project listing finds it, or is refused with cluster_assignment_cluster_deleting. Succeeds when the cluster is absent. Repeating the request succeeds. The local cluster's nil ID is rejected.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
      responses:
        "204":
          description: The deletion is recorded, or the cluster is absent.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          description: The cluster has deletion protection turned on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/clusters/{clusterID}/destroy-readiness:
    get:
      operationId: managementClusterDestroyReadiness
      summary: Check cluster destroy readiness
      description: Checks whether the cluster has deletion protection turned on, or more than one team uses this exact cluster, either as an assigned team or as the owner of active templates or snapshots on it. One team's own templates and snapshots do not block this check, because deleting the cluster soft-deletes them. Soft-deleted history does not count. Returns success if the cluster is absent. This read does not change resources or prevent later assignments or template creation.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      parameters:
        - $ref: "#/components/parameters/clusterID"
      responses:
        "204":
          description: At most one team uses the cluster.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          description: The cluster has deletion protection turned on, or more than one team uses it and the other teams and their templates must move off it before destroying the cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/500"

  /admin/teams/{teamID}/cluster:
    get:
      summary: Get a team's assigned cluster
      description: Returns the current cluster assignment without exposing cluster credentials.
      tags: [admin]
