  /v1/management/projects/{projectID}/block:
    parameters:
      - $ref: "#/components/parameters/projectID"
    put:
      operationId: managementApplyProjectBlock
      summary: Apply a project's block state (v1).
      description: >-
        Records whether the project is refused billable work, which the auth
        path reads before it lets a sandbox start. An older or duplicate
        revision is accepted without changing target state.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementProjectBlockRequest"
      responses:
        "204":
          description: Block state is applied or already superseded.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
        "501":
          $ref: "#/components/responses/501"

  /v1/management/clusters/{clusterID}:
    parameters:
      - $ref: "#/components/parameters/clusterID"
    put:
      operationId: managementRegisterCluster
      summary: Register a cluster (v1).
      description: A cluster registered here for the first time starts with deletion protection turned off. Registering an existing cluster again with the same name and auth organization updates its endpoint, TLS setting, sandbox proxy domain and token and keeps its stored deletion protection; a different name or auth organization returns a conflict.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementClusterRegistrationRequest"
      responses:
        "204":
          description: Cluster registration is present.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    delete:
      operationId: managementDeleteCluster
      summary: Delete a cluster and its environments (v1).
      description: Deletes a cluster after all team assignments are detached. In the same transaction, soft-deletes every live template, snapshot template and paused sandbox snapshot on the cluster, releases their aliases, and releases all environment references while preserving environment and build history. A team assignment rejects the deletion and leaves the environments untouched, and so does deletion protection on the cluster. The local cluster's nil ID is rejected. Repeating a completed deletion succeeds.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: Cluster is absent.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"

  /v1/management/projects/{projectID}/cluster/{clusterID}:
    parameters:
      - $ref: "#/components/parameters/projectID"
      - $ref: "#/components/parameters/clusterID"
    put:
      operationId: managementAssignProjectCluster
      summary: Assign a cluster to a project (v1).
      description: >-
        Assigns the cluster when the project has no cluster assigned. Replaying the identical
        assignment succeeds; replacing a different assigned cluster returns a conflict.
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: Cluster is assigned to the project.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
    delete:
      operationId: managementDetachProjectCluster
      summary: Detach a cluster assignment from a project (v1).
      tags: [control-plane-management]
      security:
        - AdminJWTAuth: []
      responses:
        "204":
          description: The matching assignment is absent.
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "500":
          $ref: "#/components/responses/500"
